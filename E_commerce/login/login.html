<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login &mdash; GOAT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="parent">

        <div class="div1">
            <div class="toggle-container">

                <div class="toggle-slider"></div>

                <button type="button" class="toggle-btn active" onclick="switchTab(this, 'login')">Login</button>
                <button type="button" class="toggle-btn" onclick="switchTab(this, 'register')">Register</button>
            </div>

            <div class="div-logo-white">
                <a href="../index.html" title="GOAT Store">
                    <img src="../img/Gemini_Generated_Image_jregpmjregpmjreg-removebg-preview.png" class="logo-white" alt="GOAT">
                </a>
            </div>

            <div class="credentials-quick-bar" style="width: 80%; max-width: 390px; margin: 0 auto 10px; display: flex; gap: 8px;">
                <button type="button" class="btn-quick-fill" id="btnFillUser" title="تعبئة بيانات حساب العميل / User" style="flex: 1; padding: 7px 8px; background: rgba(59, 130, 246, 0.12); border: 1px solid rgba(59, 130, 246, 0.35); border-radius: 12px; color: #60a5fa; font-size: 11.5px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.2s;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    <span>User: user@goat.com</span>
                </button>
                <button type="button" class="btn-quick-fill" id="btnFillOwner" title="تعبئة بيانات مالك المتجر / Owner" style="flex: 1; padding: 7px 8px; background: rgba(251, 191, 36, 0.1); border: 1px solid rgba(251, 191, 36, 0.35); border-radius: 12px; color: #fbbf24; font-size: 11.5px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.2s;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                    <span>Owner: owner@goat.com</span>
                </button>
            </div>

            <div class="login-alert-box" id="loginAlert"></div>

            <form id="login-form">
                <div class="input-field" id="input-email">
                    <label for="email">Username or Email</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        <input type="text" id="email" placeholder="Enter username or email" required autocomplete="username" />
                    </div>
                </div>

                <div class="input-field">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        <input type="password" id="password" placeholder="Enter password" required autocomplete="current-password" />
                        <button type="button" class="btn-toggle-eye" data-target="password" title="Show/Hide Password" aria-label="Toggle password visibility">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                </div>

                <div class="remember-forget">
                    <label class="custom-checkbox">
                        <input type="checkbox" id="remember" checked>
                        <span class="checkmark"></span>
                        <span class="label-text">Remember me</span>
                    </label>
                    <a href="#" class="forget-link">Forget Password?</a>
                </div>

                <div class="dev">
                    <button type="submit" class="btn_login" id="btnLoginSubmit">Login</button>
                </div>
            </form>

            <form id="register-form" style="display: none;">
                <div class="input-field">
                    <label for="reg-name">Full Name</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        <input type="text" id="reg-name" placeholder="Enter your full name" required autocomplete="name" />
                    </div>
                </div>

                <div class="input-field">
                    <label for="reg-email">Email Address</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                        <input type="email" id="reg-email" placeholder="Enter your email" required autocomplete="email" />
                    </div>
                </div>

                <div class="input-field">
                    <label for="reg-password">Password</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        <input type="password" id="reg-password" placeholder="Create a password" required autocomplete="new-password" />
                        <button type="button" class="btn-toggle-eye" data-target="reg-password" title="Show/Hide Password" aria-label="Toggle password visibility">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                </div>

                <div class="dev" style="margin-top: 15px;">
                    <button type="submit" class="btn_login" id="btnRegisterSubmit">Create Account</button>
                </div>
            </form>

        </div>

        <div class="div2">
            <a href="../index.html">
                <img src="../img/Gemini_Generated_Image_jregpmjregpmjreg-removebg-preview.png" alt="GOAT Logo" class="logo">
            </a>
            <h1 class="welcome-text">
                Welcome to Goat Store.
            </h1>
            <p class="description-text">
                Design to give you the best experience with top-quality brands.
            </p>
        </div>
    </div>

    <script src="../owner-credentials.js"></script>
    <script src="../user-credentials.js"></script>
    <script src="../js/products-data.js"></script>
    <script src="./script.js"></script>
</body>
</html>
